services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
