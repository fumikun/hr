name: Build and Deploy

# mainへのpushでイメージをbuildしghcr.ioにpushした後、nara-kosensai/manifest の
# hr/kustomization.yaml のimageタグをこのコミットのshaに書き換えてcommit&pushする。
# VPSへの反映はArgoCD Application `hr`(automated)がmanifestの変更を検知して行う。
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fumikun/hr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: imranismail/setup-kustomize@v2

      # manifestは別リポジトリのため、push権限を持つPAT(MANIFEST_REPO_TOKEN)を
      # このリポジトリのSecretとして事前に登録しておくこと。
      - uses: actions/checkout@v4
        with:
          repository: nara-kosensai/manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Set image tag
        run: |
          cd manifest-repo/hr
          kustomize edit set image ghcr.io/fumikun/hr=ghcr.io/fumikun/hr:${{ github.sha }}

      # [skip ci]でmanifest側CI(deploy.yml)の再トリガーを防ぐ
      - name: Commit and push
        run: |
          cd manifest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hr/kustomization.yaml
          git diff --cached --quiet || git commit -m "deploy: update hr image tag to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin main
